<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RefGuide - 漫画创作者参考库</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-sidebar: #1a1a1a;
            --bg-card: #2a2a2a;
            --text-main: #ffffff;
            --text-dim: #888888;
            --accent: #ccff00; /* 荧光黄强调色 */
            --accent-dim: rgba(204, 255, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- 1. 左侧一级导航 (L1 Sidebar) --- */
        .sidebar {
            width: 90px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            border-right: 1px solid #333;
            z-index: 100;
        }

        .logo {
            font-weight: 900;
            color: var(--accent);
            font-size: 1.2rem;
            margin-bottom: 40px;
            letter-spacing: -1px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px 0;
            cursor: pointer;
            color: var(--text-dim);
            transition: var(--transition);
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            color: var(--text-main);
            background-color: rgba(255,255,255,0.05);
        }

        .nav-item.active {
            color: var(--accent);
            border-left: 3px solid var(--accent);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 8px;
            fill: currentColor;
        }

        .nav-text {
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* --- 2. 主内容区 --- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- 3. 顶部二级筛选 & 工具栏 (L2 Header) --- */
        .top-bar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 90;
            border-bottom: 1px solid #333;
        }

        .tags-container {
            display: flex;
            gap: 12px;
        }

        .pill {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-dim);
            background-color: var(--bg-card);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .pill:hover {
            color: var(--text-main);
            border-color: #555;
        }

        .pill.active {
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
        }

        /* 右侧工具栏 */
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .divider {
            height: 24px;
            width: 1px;
            background-color: #444;
            margin: 0 8px;
        }

        .tool-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 8px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .tool-btn:hover {
            color: var(--text-main);
            background-color: rgba(255,255,255,0.1);
        }

        .tool-btn.active {
            color: var(--accent);
        }

        .icon-svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* --- 4. 货架内容区 (L3 Shelves) --- */
        .content-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0 100px 40px; /* Bottom padding for moodboard space */
        }

        .shelf-section {
            margin-bottom: 40px;
        }

        .shelf-header {
            display: flex;
            align-items: baseline;
            margin-bottom: 15px;
        }

        .shelf-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-right: 12px;
        }

        .shelf-subtitle {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .shelf-row-wrapper {
            position: relative;
            /* Fade effect on the right to indicate more content */
            mask-image: linear-gradient(to right, black 90%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, black 90%, transparent 100%);
        }

        .shelf-row {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 10px 0 20px 0; /* Padding allows hover scale without clipping */
            scroll-behavior: smooth;
        }

        /* Hide scrollbar but keep functionality */
        .shelf-row::-webkit-scrollbar {
            display: none;
        }

        .card {
            min-width: 200px;
            height: 280px;
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid #333;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: var(--transition);
        }

        /* 悬停放大效果 */
        .card:hover {
            transform: scale(1.1) translateY(-5px);
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border-color: var(--accent);
        }

        .card:hover img {
            opacity: 1;
        }

        .card-actions {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: var(--transition);
        }

        .card:hover .card-actions {
            opacity: 1;
        }

        .mini-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: rgba(0,0,0,0.8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
        }
        
        .mini-btn:hover {
            background-color: var(--accent);
            color: black;
        }

        .see-more {
            min-width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .see-more:hover {
            color: var(--accent);
        }

        /* --- 5. 悬浮灵感板 (Moodboard) --- */
        .moodboard-dock {
            position: fixed;
            bottom: 20px;
            right: 40px;
            background-color: rgba(30,30,30,0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 200;
        }

        .mb-preview {
            display: flex;
            gap: -10px; /* Overlap effect */
        }

        .mb-thumb {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            border: 2px solid #333;
            background-color: #555;
            object-fit: cover;
        }

        .mb-info {
            display: flex;
            flex-direction: column;
        }
        
        .mb-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .mb-count {
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .btn-download {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Helper for dummy images */
        .placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.2);
            font-weight: 700;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- 左侧一级导航 -->
    <nav class="sidebar">
        <div class="logo">RG.</div>
        
        <div class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>

            <span class="nav-text">动作</span>
        </div>

        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
            <span class="nav-text">职业</span>
        </div>

        <div class="nav-item">

        </div>
    </nav>

    <!-- 主容器 -->
    <div class="main-container">

        <!-- 顶部二级筛选 & 工具 -->
        <header class="top-bar">
            <!-- 左侧：二级标签 -->
            <div class="tags-container">

                <div class="pill">惊 Surprised</div>
                <div class="pill">蔑 Disgust</div>
            </div>

            <!-- 右侧：排序与筛选 -->
            <div class="toolbar-right">
                <!-- 排序：热门 -->
                <button class="tool-btn active" title="按热度排序">

                    热门
                </button>
                <!-- 排序：最新 -->
                <button class="tool-btn" title="按时间排序">

                    最新
                </button>
                
                <div class="divider"></div>

                <!-- 筛选漏斗 -->
                <button class="tool-btn" title="高级筛选">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
                    筛选
                </button>
            </div>
        </header>

        <!-- 内容滚动区 (Netflix 风格货架) -->
        <div class="content-scroll-area">
            
            <!-- Row 1: 微笑 -->
            <section class="shelf-section">
                <div class="shelf-header">

                    <span class="shelf-subtitle">含蓄、讽刺、自信</span>

                <div class="shelf-row-wrapper">
                    <div class="shelf-row">

                        <div class="card">

                        </div>
                        <div class="card">
                            <img src="https://placehold.co/400x533/2a2a2a/666?text=Smirk+03" alt="ref">
                        </div>
                        <div class="card">
                            <img src="https://placehold.co/400x533/2a2a2a/666?text=Smirk+04" alt="ref">
                        </div>
                        <div class="card">
                            <img src="https://placehold.co/400x533/2a2a2a/666?text=Smirk+05" alt="ref">
                        </div>
                        <div class="card">
                            <img src="https://placehold.co/400x533/2a2a2a/666?text=Smirk+06" alt="ref">
                        </div>

                    </div>
                </div>
            </section>

            <!-- Row 2: 露齿笑 -->
            <section class="shelf-section">
                <div class="shelf-header">
                    <h2 class="shelf-title">露齿笑 / Grin</h2>
                    <span class="shelf-subtitle">阳光、开朗、假笑</span>
                </div>
                <div class="shelf-row-wrapper">
                    <div class="shelf-row">
                        <div class="card">
                            <img src="https://placehold.co/400x533/333/777?text=Grin+01" alt="ref">
                        </div>
                        <div class="card">
                            <img src="https://placehold.co/400x533/333/777?text=Grin+02" alt="ref">
                        </div>
                        <div class="card">
                            <img src="https://placehold.co/400x533/333/777?text=Grin+03" alt="ref">
                        </div>
                        <div class="card">

            <!-- Row 3: 大笑 -->

                <div class="shelf-header">

                    <span class="shelf-subtitle">狂喜、捧腹、失控</span>
                </div>
                <div class="shelf-row-wrapper">
                    <div class="shelf-row">
                        <div class="card">
                            <img src="https://placehold.co/400x533/1a1a1a/444?text=Laugh+01" alt="ref">
                        </div>
                        <div class="card">
                            <img src="https://placehold.co/400x533/1a1a1a/444?text=Laugh+02" alt="ref">
                        </div>
                        <div class="card">
                            <img src="https://placehold.co/400x533/1a1a1a/444?text=Laugh+03" alt="ref">

        </div>
    </div>

    <!-- 悬浮灵感板 -->
